processResources {
    def keys = [
            'mod_id',
            'mod_name',
            'mod_version',
            'mod_description',
            'mod_authors',
            'mod_credits',
            'mod_url',
            'mod_logo_path',
            'minecraft_version',
            'loader',
            'loader_version',
            'loader_version_range',
    ]
    def props = keys.collectEntries { key ->
        def value = findProperty(key)
        value == null ? [:] : [(key): value.toString()]
    }
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'mcmod.info', 'pack.mcmeta']) {
        expand props
    }
}

tasks.register('prepareServerDev') {

    File serverDir = file("run/server")
    File eulaFile = file("${serverDir}/eula.txt")
    File propsFile = file("${serverDir}/server.properties")

    outputs.files(eulaFile, propsFile)

    doLast {
        serverDir.mkdirs()

        eulaFile.text = 'eula=true\n'

        Properties properties = new Properties()

        if (propsFile.exists()) {
            propsFile.withReader('UTF-8') {
                properties.load(it)
            }
        }

        properties.setProperty('online-mode', 'false')

        propsFile.withWriter('UTF-8') {
            properties.store(it, null)
        }
    }
}

tasks.matching { it.name == 'runServer' }.configureEach {
    dependsOn 'prepareServerDev'
}
