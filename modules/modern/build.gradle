plugins {
    id 'java'
    alias(libs.plugins.legacyforge)
    alias(libs.plugins.shadow)
}

legacyForge {
    version = "${minecraft_version}-${loader_version}"

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'INFO'
        }

        client {
            client()
            ideName = "Modern Client"
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            ideName = "Modern Server"
            gameDirectory = project.file('run/server')
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

shadowJar {
    manifest {
        attributes 'FMLAT': 'accesstransformer.cfg'
    }
}

tasks.named('reobfJar') {
    enabled = false
}

obfuscation {
    reobfuscate(tasks.named('shadowJar'), sourceSets.main)
}

tasks.named('reobfShadowJar') {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
}
