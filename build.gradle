plugins {
    id 'java'
    id 'java-library'
    id 'idea'
    alias(libs.plugins.legacyforge)
    alias(libs.plugins.shadow)
    alias(libs.plugins.spotless)
}

base {
    version = mod_version
    group = mod_package
    archivesName = "${mod_name}-${mod_name_suffix}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(java_version))
    }
}

apply from: 'gradle/scripts/repositories.gradle'
apply from: 'gradle/scripts/dependencies.gradle'
apply from: 'gradle/scripts/resources.gradle'
apply from: 'gradle/scripts/spotless.gradle'

legacyForge {
    version = "${minecraft_version}-${loader_version}"

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')


    runs {
        configureEach {
            gameDirectory = project.file('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'INFO'
        }

        client {
            client()
            ideName = "Client"
            gameDirectory = project.file('run/client')
        }

        server {
            server()
            ideName = "Server"
            gameDirectory = project.file('run/server')
            programArgument '--nogui'

            taskBefore tasks.named("prepareServerDev")
        }

    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_package
        )
    }
}
